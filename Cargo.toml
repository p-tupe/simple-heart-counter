[package]
name = "simple-heart-counter"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
axum-client-ip = "1.3.1"
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rusqlite = "0.8.0"
tower-http = { version = "0.7.1", features = ["cors"] }

[profile.dev]
incremental = true
